
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Luna Accessories</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">
        LUNA <span>ACCESSORIES</span>
    </a>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="earrings.html">Earrings</a>
        <a href="necklaces.html">Necklaces</a>
        <a href="bracelets.html">Bracelets & Rings</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

    </nav>
</header>

<main class="product-details-section">

    <a href="shop.html" class="back-link">← Back to Shop</a>

    <div class="product-details">

        <div class="product-image">
            <img id="productImage" src="" alt="Jewellery product">
        </div>

        <div class="product-info">

            <p class="subtitle">LUNA COLLECTION</p>

            <h1 id="productName">Product Name</h1>

            <h2 id="productPrice">Price</h2>

            <p id="productDescription"></p>

            <div class="product-specifications">
                <p><strong>Category:</strong> <span id="productCategory"></span></p>
                <p><strong>Material:</strong> <span id="productMaterial"></span></p>
                <p><strong>Colour:</strong> <span id="productColour"></span></p>
                <p><strong>Style:</strong> <span id="productStyle"></span></p>
                <p><strong>Occasion:</strong> <span id="productOccasion"></span></p>
                <p><strong>Care:</strong> <span id="productCare"></span></p>
            </div>

            <a href="contact.html" class="btn">Enquire About This Item</a>

        </div>

    </div>

</main>

<footer class="footer">
