
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Luna Accessories</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">
        LUNA <span>ACCESSORIES</span>
    </a>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="earrings.html">Earrings</a>
        <a href="necklaces.html">Necklaces</a>

        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQs</a>
    </nav>
</header>

<main>
    <section class="contact-section">

        <p class="subtitle">WE WOULD LOVE TO HEAR FROM YOU</p>
        <h1>Get In Touch</h1>

        <p class="contact-intro">
            Have a question about our jewellery?
            Send us a message!
        </p>

        <form class="contact-form" id="contactForm">

            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="What is your enquiry about?" required>

            <label for="message">Your Message</label>
            <textarea id="message" rows="6" placeholder="Write your message here..." required></textarea>

            <button type="submit" class="btn">Send Message</button>

            <p id="formMessage" aria-live="polite"></p>

        </form>
    </section>
</main>

<footer class="footer">
    <p>© 2026 Luna Accessories. All rights reserved.</p>
    <p>Elegance is always in style.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
